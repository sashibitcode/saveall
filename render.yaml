services:
  - type: web
    name: saveall-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: INSTAGRAM_COOKIES_B64
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: YOUTUBE_PROXY
        sync: false
